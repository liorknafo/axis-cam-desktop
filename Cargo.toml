[package]
name = "axis-cam"
version = "0.1.0"
edition = "2024"
description = "AXIS CAM Studio — native Rust/Iced CAM workflow prototype"
license = "MIT"

[dependencies]
iced = { version = "0.14", features = ["advanced", "canvas", "svg", "image", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
rfd = "0.15"
png = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
# Runs an Iced `Task` to its messages (`task::into_stream`): the headless MCP
# session (`mcp::runner`) and the tests; draws the Steps screens headless for
# the shop tablet (`steps::tablet`). Already in the tree through iced.
iced_runtime = "0.14"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "form"] }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
base64 = "0.23.1"
getrandom = "0.4.3"
futures-util = "0.3.34"
sha2 = "0.10"
clipper2 = "0.6.0"
fidget = { version = "=0.4.3", default-features = false, features = ["mesh"] }
toml_edit = "0.25"
uc100 = { git = "https://github.com/liorknafo/UC100-driver.git", rev = "bb3ae02961f3d3c5a9008700ffdbedcf77f3b0f1", default-features = false }
# The UC100 run by uc100-server on a Raspberry Pi, across the network ("Network (Pi)").
uc100-remote = { git = "https://github.com/liorknafo/uc100-server.git", rev = "34469ca071d581e7fbe3e50fbc69114a68175605" }
# The GPU stock mesher (`gpu_mesh`), on the wgpu iced already draws with.
wgpu = "27"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
# The run's stock mesher sets its thread's QoS (`below_the_driver`).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# A session's lock on one byte past its owner (`mcp::session::Lock`), so the
# owner stays readable; already in the tree.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[profile.release]
opt-level = 2
strip = true

# Keep adaptive meshing responsive in local debug/test builds too.
[profile.dev.package.fidget-core]
opt-level = 2
[profile.dev.package.fidget-mesh]
opt-level = 2

# Dependencies without debug info: a fifth smaller target/ (5.2 GB, from 6.4
# GB after a cold `cargo test --no-run`), and as fast to build and link
# (LIO-729). The UC100 driver and uc100-server keep theirs: the smoke tests
# run them, and a backtrace through them keeps each frame's file and line.
[profile.dev.package."*"]
debug = false
[profile.dev.package.uc100]
debug = true
[profile.dev.package.uc100-remote]
debug = true

[target.'cfg(unix)'.dev-dependencies]
# Asks each of the test process's open files what it is (`fstat`), with no
# duplicate or close (`mcp::runner`'s tests); already in the tree.
libc = "0.2"

[dev-dependencies]
# Lay a page out on the software renderer, with no window, to read its widget
# tree and click it (`ui::probe`); both are already in the tree through iced.
iced_renderer = "0.14"
iced_tiny_skia = "0.14"
# Generates the fake sign-in server's RSA key at test time (already in the tree
# through jsonwebtoken and rustls).
aws-lc-rs = "1"
