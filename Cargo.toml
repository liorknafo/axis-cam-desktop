[package]
name = "axis-cam"
version = "0.1.0"
edition = "2024"
description = "AXIS CAM Studio — native Rust/Iced CAM workflow prototype"
license = "MIT"

[dependencies]
iced = { version = "0.14", features = ["advanced", "canvas", "svg", "image", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
rfd = "0.15"
png = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "sync", "macros"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "form"] }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
base64 = "0.23.1"
getrandom = "0.4.3"
futures-util = "0.3.34"
sha2 = "0.10"
clipper2 = "0.6.0"
fidget = { version = "=0.4.3", default-features = false, features = ["mesh"] }
toml_edit = "0.25"
uc100 = { git = "https://github.com/liorknafo/UC100-driver.git", rev = "35cf9d77103481a6975166a28aef1635d8c69ee1", default-features = false }
# The UC100 run by uc100-server on a Raspberry Pi, across the network ("Network (Pi)").
uc100-remote = { git = "https://github.com/liorknafo/uc100-server.git", rev = "844e51867a1d674ddf9def2bc7d6e9c1cc757295" }
# The GPU stock mesher (`gpu_mesh`), on the wgpu iced already draws with.
wgpu = "27"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
# The run's stock mesher sets its thread's QoS (`below_the_driver`).
libc = "0.2"

[profile.release]
opt-level = 2
strip = true

# Keep adaptive meshing responsive in local debug/test builds too.
[profile.dev.package.fidget-core]
opt-level = 2
[profile.dev.package.fidget-mesh]
opt-level = 2

[dev-dependencies]
# Lets a test run an Iced `Task` to its messages (`task::into_stream`).
iced_runtime = "0.14"
# Lay a page out on the software renderer, with no window, to read its widget
# tree and click it (`ui::probe`); both are already in the tree through iced.
iced_renderer = "0.14"
iced_tiny_skia = "0.14"
# Generates the fake sign-in server's RSA key at test time (already in the tree
# through jsonwebtoken and rustls).
aws-lc-rs = "1"
