[package]
name = "axis-cam"
version = "0.1.0"
edition = "2024"
description = "AXIS CAM Studio — native Rust/Iced CAM workflow prototype"
license = "MIT"

[dependencies]
iced = { version = "0.14", features = ["canvas", "svg", "image", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
rfd = "0.15"
png = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
tempfile = "3"
tokio = { version = "1", features = ["rt"] }
sha2 = "0.10"
clipper2 = "0.6.0"
fidget = { version = "=0.4.3", default-features = false, features = ["mesh"] }

[profile.release]
opt-level = 2
strip = true

# Keep adaptive meshing responsive in local debug/test builds too.
[profile.dev.package.fidget-core]
opt-level = 2
[profile.dev.package.fidget-mesh]
opt-level = 2
